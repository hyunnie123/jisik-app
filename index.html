<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>지식 작업실</title>
<meta name="description" content="공략집, 정리본, 업무일지를 쓰고 PDF로 묶는 개인 작업실">
<link rel="stylesheet" href="content.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f2e8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="merge.js"></script>
<script src="phone.js"></script>
<link rel="stylesheet" href="mind.css">
<script src="mind.js"></script>
<link rel="stylesheet" href="patterns.css">
<link rel="stylesheet" href="ptwrap.css">
<script src="pattern.js"></script>
<link rel="stylesheet" href="blocks.css">
<script src="blocks.js"></script>
<script src="board.js"></script>
<style>


/* 11/13 개편: 덜어내기 · 따뜻한 종이 · 쓰는 동안 화면이 물러남(iA Writer) · 오늘부터 쓰기(Day One·Logseq 저널) · 조용한 사이드바(Bear·Obsidian Minimal)
   11/14 홀마크: 장식 점·글자 아이콘·색 번짐 그림자·들뜨는 카드 걷어냄, 색은 전부 토큰, 키보드 테두리 */
:root{
  --font:NK,Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --desk:#ece6d8; --side:#f6f2e8; --paper:#f4eee1; --line:#e2d8c4; --line2:#d6c9ad; --ink:#2a2620; --ink2:#3b362e; --ink3:#554e43; --muted:#7f7462; --faint:#a89c84; --hover:#ede6d6;
  --raised:#fdfaf3; --well:#ebe4d4; --on-acc:#fdfaf3; --ph:#bfb39b; --hl:#f6d860; --note:#fbf0cf; --note-line:#ead79c; --toast:#2a2620;
  --cam-black:#141210; --cam-hover:#4a443b;
  --shade:rgba(60,45,25,.08); --shade2:rgba(60,45,25,.12); --sheen:rgba(255,255,255,.6); --wear:rgba(150,125,90,.11); --veil:rgba(42,38,32,.2);
  --g:#9b3a2c; --g-soft:#f3e2db; --j:#3f6e57; --j-soft:#e2ede6; --h:#3d6585; --h-soft:#e1e9f1; --m:#8a6420; --m-soft:#f1e7cf; --warn:#a3271f;
  --acc:var(--g); --soft:var(--g-soft);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:clip;background:var(--desk);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:256px 1fr;height:100vh;height:100dvh}
.side,.tabs,.bar{transition:opacity .45s}
.app.typing .side,.app.typing .tabs,.app.typing .bar{opacity:.18}
.app.typing .side:hover,.app.typing .tabs:hover,.app.typing .bar:hover,.app.typing .side:focus-within,.app.typing .bar:focus-within{opacity:1}

/* 왼쪽 */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{padding:24px 20px 12px;display:flex;align-items:baseline;gap:8px}
.brand b{font-size:17px;font-weight:800}
.brand span{font-size:12px;color:var(--faint)}
.todayBtn{margin:4px 16px 12px;display:flex;align-items:center;gap:8px;border:0;background:var(--h);color:var(--on-acc);border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:700;text-align:left}
.todayBtn:hover{filter:brightness(1.08)}
.todayBtn small{margin-left:auto;font-weight:500;opacity:.85;font-size:12px}
.search{margin:0 16px 8px;position:relative}
.search input{width:100%;border:1px solid transparent;background:var(--well);border-radius:10px;padding:8px 12px 8px 32px;font:inherit;font-size:13.5px;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input:focus{background:var(--raised)}
.search input:focus-visible{outline:2px solid var(--h);outline-offset:0}
.search svg{position:absolute;left:12px;top:10px;width:14px;height:14px;color:var(--muted)}
.cols{overflow:auto;padding:4px 8px 20px;flex:1}
.col{margin-top:16px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--c,var(--muted))}
.col-h .n{font-weight:500;color:var(--faint)}
.col-h .add{margin-left:auto;border:0;background:none;width:24px;height:24px;border-radius:8px;font-size:17px;line-height:1;color:var(--faint)}
.col-h .add:hover{background:var(--hover);color:var(--c)}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.4;color:var(--ink2)}
.item:hover{background:var(--hover)}
.item.on{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--c),0 1px 2px var(--shade)}
.item small{display:block;color:var(--faint);font-size:11.5px;font-weight:400;margin-top:1px}
.item.pdfonly{color:var(--muted)}
/* 11/21 목록에서 바로 지우기 — 줄에 마우스를 올리면 오른쪽 휴지통 아이콘(Finder·Notion 사이드바), 오른쪽 클릭·길게 누르기 = 메뉴 */
.row{position:relative}
.row .item{padding-right:36px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.rowDel{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--faint);display:flex;align-items:center;justify-content:center;opacity:0;cursor:pointer}
.rowDel svg{width:15px;height:15px}
.row:hover .rowDel,.rowDel:focus-visible{opacity:1}
.rowDel:hover{background:var(--well);color:var(--warn)}
.phone .rowDel{display:none}
@media (hover:none){.rowDel{display:none}}
.trashLink{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:12px 8px 4px;border:0;border-top:1px dashed var(--line2);background:none;padding:12px 12px 8px;font-size:13px;color:var(--muted);text-align:left}
.trashLink svg{width:15px;height:15px}
.trashLink:hover{color:var(--ink)}
.trashLink .n{color:var(--faint)}
.ctx{position:fixed;z-index:60;min-width:168px;background:var(--raised);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px var(--veil);padding:4px;display:flex;flex-direction:column}
.ctx[hidden]{display:none}
.ctx .who{font-size:11.5px;color:var(--faint);padding:6px 10px 4px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:7px;font-size:14px;color:var(--ink2)}
.ctx button:hover,.ctx button:focus-visible{background:var(--hover);outline:none}
.ctx button.danger{color:var(--warn)}
.tr-row{display:flex;align-items:center;gap:10px}
.tr-row .grow{flex:1;min-width:0}
.tr-row .nm{font-weight:600;color:var(--ink)}
.tr-row .btn{flex:none;height:30px}
.reviveBn{flex:none;margin:8px 16px 0;max-width:none}
.sub{font-size:11.5px;color:var(--faint);padding:12px 12px 4px}
.empty{font-size:13px;color:var(--faint);padding:4px 12px}
.hit small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{padding:12px 20px 16px;font-size:12px;color:var(--faint);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.side-foot button{border:0;background:none;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--muted)}
.side-foot button:hover{background:var(--hover);color:var(--ink)}

.shotBtn{margin:0 16px 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--raised);color:var(--ink2);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;text-align:left}
.shotBtn svg{width:18px;height:18px;color:var(--h)}
.shotBtn:hover{border-color:var(--h);color:var(--ink)}
.shotBtn:active{background:var(--hover)}

/* 필사 찍기 창 */
.cam{width:calc(100% - 32px);max-width:960px;max-height:calc(100vh - 32px);border:0;border-radius:16px;padding:0;background:var(--toast);color:var(--on-acc);display:none;flex-direction:column;overflow:hidden}
.cam[open]{display:flex}
.cam::backdrop{background:var(--veil)}
.cam-top{display:flex;align-items:baseline;gap:12px;padding:16px 20px 12px;font-size:13px}
.cam-top b{font-size:16px}
.cam-top span{opacity:.75}
.cam-x{margin-left:auto;color:var(--on-acc)}
.cam-x:hover{background:var(--cam-hover);color:var(--on-acc)}
.cam-stage{position:relative;background:var(--cam-black);aspect-ratio:16/9;min-height:0}
.cam-stage video{width:100%;height:100%;object-fit:contain;display:block;transform:scaleX(-1)}
.cam-stage.flash::after{content:"";position:absolute;inset:0;background:var(--on-acc);animation:flash .25s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.6}to{opacity:0}}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14.5px;line-height:1.8}
.cam-msg[hidden]{display:none}
.cam-retry{margin-top:16px}
.cam-strip{display:flex;gap:8px;padding:12px 20px 0;overflow-x:auto;min-height:12px}
.cam-strip figure{position:relative;margin:0;flex:none}
.cam-strip img{display:block;height:72px;border-radius:6px}
.cam-strip figcaption{position:absolute;left:4px;top:4px;font-size:11px;font-weight:700;background:var(--toast);padding:0 6px;border-radius:4px}
.cam-del{position:absolute;right:4px;bottom:4px;border:0;border-radius:6px;background:var(--toast);color:var(--on-acc);font-size:11px;padding:2px 6px}
.cam-del:hover{background:var(--warn)}
.cam-bot{display:flex;align-items:center;gap:12px;padding:12px 20px 16px}
.cam-bot .status{color:var(--on-acc);opacity:.75}
.shutter{border:3px solid var(--on-acc);background:var(--h);color:var(--on-acc);height:56px;min-width:120px;padding:0 24px;border-radius:28px;font-size:16px;font-weight:800}
.shutter:hover{filter:brightness(1.1)}
.shutter:active{transform:scale(.97)}
.shutter:disabled{background:var(--cam-hover);border-color:var(--cam-hover);color:var(--faint);cursor:not-allowed}

/* 오른쪽 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;align-items:center;gap:4px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none;min-height:48px}
.tab{display:flex;align-items:center;gap:8px;max-width:230px;padding:6px 6px 6px 12px;border-radius:8px;font-size:13px;color:var(--muted);background:none;white-space:nowrap;cursor:pointer}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--c),0 1px 2px var(--shade)}
.tab .t{overflow:hidden;text-overflow:ellipsis}
.tab .dirty{font-size:11px;font-weight:500;color:var(--warn)}
.tab .x{border:0;background:none;width:20px;height:20px;border-radius:6px;color:var(--faint);font-size:15px;line-height:1;padding:0;font-weight:400}
.tab .x:hover{background:var(--hover);color:var(--ink)}

.bar{display:flex;align-items:center;gap:2px;margin:8px 16px 0;padding:4px 8px;background:var(--raised);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.bar[hidden]{display:none}
.tb{border:0;background:none;height:32px;min-width:32px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px}
.tb:hover{background:var(--hover);color:var(--ink)}
.tb:active{background:var(--line)}
.tb b{font-weight:800}
.tb.on{background:var(--well);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.tb .hl{background:var(--hl);padding:0 4px;border-radius:3px;color:var(--ink)}
.tb .rd{color:#d2232a;font-weight:800}
.tb .qk{background:var(--ink);color:var(--paper);padding:0 6px;border-radius:3px;font-weight:700;box-shadow:inset 0 3px 0 var(--warn)}
.tb svg{width:16px;height:16px}
.sep{width:1px;height:16px;background:var(--line);margin:0 4px}
.grow{flex:1}
.status{font-size:12px;color:var(--faint);margin-right:8px;white-space:nowrap}
.status.busy{color:var(--acc)}
.status.err{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--raised);height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--ink3)}
.btn:hover{border-color:var(--line2);color:var(--ink)}
.btn:active{background:var(--hover)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700;padding:0 16px}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled,.btn.primary:disabled{background:var(--well);border-color:var(--well);color:var(--muted);cursor:not-allowed;filter:none}
.btn.ghost:disabled{background:none;border-color:transparent}
.btn[hidden]{display:none}

.scroll{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth}
.paper{position:relative;max-width:760px;margin:24px auto 140px;background-color:var(--paper);
  background-image:radial-gradient(ellipse at 12% 8%,var(--sheen),transparent 55%),radial-gradient(ellipse at 90% 88%,var(--wear),transparent 60%);
  border-radius:4px;padding:56px 68px 90px;box-shadow:0 1px 2px var(--shade),0 18px 48px var(--shade2)}
.stamp{position:absolute;top:26px;right:28px;border:2px solid var(--g);color:var(--g);font-weight:900;font-size:11px;padding:3px 9px;transform:rotate(4deg);opacity:.7;user-select:none}
.kicker{padding-right:140px;font-size:11.5px;font-weight:700;color:var(--muted)}
.title{display:block;resize:none;overflow:hidden;width:100%;border:0;outline:none;font:inherit;font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.3;margin:14px 0 6px;padding:0 0 16px;border-bottom:2px solid var(--ink);background:none;color:var(--ink)}
.title[readonly]{cursor:default}
.title::placeholder{color:var(--ph)}
.motto{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--g);background:var(--g-soft);font-size:14px;line-height:1.65;color:var(--ink2);font-weight:600;user-select:none}
.hint{font-size:12.5px;color:var(--muted);margin:-2px 0 0;line-height:1.6}
#ed{outline:none;min-height:50vh;padding-top:16px;caret-color:var(--acc)}
#ed:empty::before{content:"여기에 쓰세요. 위 도구나 「/」로 큰 제목·핵심 상자·마인드맵을 넣을 수 있어요.";color:var(--ph)}
#ed.journal:empty::before{content:"오늘 있었던 일, 잘된 이유·안된 이유, 「아 이거 아니네, 그럼 이건가」… 형식 없이 막 쓰세요."}
#ed h2{position:relative}
#ed > :first-child{margin-top:0}  /* 11/14 맨 위 큰 제목 위 빈 칸(여백이라 지워지지 않던 것) 없앰 — PDF는 표지 다음 새 쪽이라 상관없음 */
#ed:not(.journal) h2::after{content:"PDF 새 쪽";position:absolute;right:0;top:.55em;font-size:10.5px;font-weight:500;color:var(--faint)}
#ed.journal > h2:last-of-type + p{position:relative}
#ed.journal > h2:last-of-type + p:last-child:has(> br:only-child)::before{content:"오늘 뭐가 잘됐고, 뭐가 안됐나요? 왜 그랬을까요?";position:absolute;left:0;top:0;color:var(--ph);pointer-events:none}

/* 첫 화면 */
.welcome{max-width:640px;margin:9vh auto 80px;padding:0 24px}
.welcome .hi{font-size:13px;color:var(--muted);margin:0 0 8px}
.welcome h1{text-wrap:balance;font-size:28px;line-height:1.35;color:var(--ink);margin:0 0 24px;font-weight:900;letter-spacing:-.02em}
.big{display:block;width:100%;text-align:left;border:0;border-radius:16px;padding:24px 28px;background:var(--h);color:var(--on-acc)}
.big:hover{filter:brightness(1.08)}
.big:active{filter:brightness(.96)}
.big b{display:block;font-size:20px;font-weight:800;margin-bottom:4px}
.big span{font-size:13.5px;opacity:.88;line-height:1.55}
.three{margin-top:8px;border-top:1px solid var(--line2)}
.card{display:flex;align-items:baseline;gap:16px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 8px;text-align:left}
.card:hover{background:var(--hover)}
.card b{flex:none;width:120px;font-size:14.5px;color:var(--c)}
.card span{font-size:13px;line-height:1.55;color:var(--muted)}
.recent{margin-top:32px}
.recent h2{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 0 8px}
.recent button{display:flex;width:100%;align-items:baseline;gap:12px;border:0;background:none;text-align:left;padding:8px;border-radius:8px;font-size:14px}
.recent button:hover{background:var(--hover)}
.recent button em{flex:none;width:56px;font-style:normal;font-size:12px;font-weight:600;color:var(--c)}
.recent button small{margin-left:auto;color:var(--faint);font-size:12px}
.rules{margin-top:32px;font-size:12.5px;color:var(--muted);line-height:1.75;border-top:1px dashed var(--line2);padding-top:16px}

.banner{max-width:760px;margin:16px auto -8px;background:var(--note);border:1px solid var(--note-line);border-radius:12px;padding:8px 16px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.banner .grow{flex:1}
.banner.outside{align-items:flex-start;flex-wrap:wrap}
.banner .chgNote{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.6;max-height:180px;overflow:auto}
.doc .jx-new{box-shadow:inset 3px 0 0 #e0b100;background:rgba(255,210,0,.16);transition:background .8s,box-shadow .8s}   /* 11/16 다른 곳에서 바뀐 곳 — 저장본에는 안 남음(edHtml·save·서버에서 걷음) */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--toast);color:var(--on-acc);font-size:13.5px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 집중 모드 */
.app.focus{grid-template-columns:0 1fr}
.app.focus .side{border:0}
.app.focus .tabs{display:none}

@media (prefers-reduced-motion:reduce){
  .side,.tabs,.bar,.toast{transition:none}
  .cam-stage.flash::after{animation:none}
  .scroll{scroll-behavior:auto}
}
@media (max-width:760px){
  .app,.app.focus{grid-template-columns:1fr}
  .side{display:none}
  .app.menu .side{display:flex;position:fixed;inset:0 20% 0 0;z-index:5;box-shadow:0 0 40px var(--veil)}
  .paper{margin:10px 10px 80px;padding:24px 18px 50px;border-radius:10px}
  .title{font-size:24px}
  .stamp{top:14px;right:14px;font-size:9.5px;padding:2px 6px}
  .kicker{padding-right:0;margin-top:22px}
  .menu-btn{display:inline-flex!important}
  .card{flex-direction:column;gap:2px}
}
.menu-btn{display:none}
/* 11/15 폰앱: 필사 찍기·폴더 열기는 맥 일 (PDF 보기는 폰에도 — 맥이 만든 PDF를 폰에 받아 둠) */
.phone #shotBtn,.phone .side-foot{display:none!important}
.outside{background:var(--h-soft);border-color:var(--h)}
/* 11/15 큰 제목 순서 바꾸기 — 제목 왼쪽 ▲▼ (끌기 X, 누르기만) */
.mv{position:absolute;left:20px;width:28px;display:flex;flex-direction:column;gap:3px;z-index:3;user-select:none}
.mv button{width:28px;height:22px;border:1px solid var(--line,#d9cdb4);border-radius:6px;background:var(--paper);color:var(--muted);font-size:11px;line-height:1;cursor:pointer;padding:0}
.mv button:hover:not(:disabled){background:var(--acc);color:#fff;border-color:var(--acc)}
.mv button:disabled{opacity:.25;cursor:default}
@media (max-width:700px){.mv{left:-2px;width:22px}.mv button{width:22px;height:20px}}
/* 11/16 댓글 — 고른 글자에 고칠 지시. 점선 밑줄 + 옅은 파랑(형광펜 노랑과 다름). PDF에는 안 나옴(server.py strip_cmts) */
:root{--cmt:#e3ebf2;--cmt-on:#c6d7e6}
#ed .cmt{background:var(--cmt);border-bottom:2px dotted var(--h);border-radius:2px;cursor:pointer}
#ed .cmt[data-reply]{border-bottom-color:var(--warn)}
.cmtPop{position:fixed;z-index:20;border:0;background:var(--h);color:var(--on-acc);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 4px 14px var(--shade2)}
.cmtPop[hidden],.cmtSheet[hidden]{display:none}
.scroll.rail .paper{margin-left:max(24px,calc((100% - 1016px)/2));margin-right:auto}
/* 11/20 마인드맵 칸 — 편집 화면은 mind.js·mind.css, 여기선 칸 전환만 */
.app.mindmode .bar [data-cmd],.app.mindmode .bar .sep,.app.mindmode #cmtBtn,.app.mindmode #cmtNav,.app.mindmode #focusBtn,.app.mindmode #count{display:none!important}
.app.mindmode .scroll{overflow:hidden;display:flex;flex-direction:column;scroll-behavior:auto}
.app.mindmode .scroll>.banner{flex:none;margin:8px 16px 0}
.mwrap{flex:1;min-height:0;display:flex;flex-direction:column;margin:8px 16px 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.mtitle{flex:none;border:0;border-bottom:1px solid var(--line);background:var(--raised);font:inherit;font-size:16px;font-weight:800;color:var(--ink);padding:9px 14px;resize:none;outline:none;height:42px;line-height:24px;overflow:hidden;white-space:nowrap}
.mtitle::placeholder{color:var(--ph);font-weight:600}
.mhost{flex:1;min-height:0;position:relative}
@media (max-width:760px){.mwrap{margin:6px 6px 8px;border-radius:10px}}
.cc{position:absolute;left:calc(100% + 16px);width:232px;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--h);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55;color:var(--ink2);box-shadow:0 1px 2px var(--shade);z-index:2}
.cc.on{border-color:var(--h);box-shadow:0 4px 16px var(--shade2)}
.cc .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--h);margin-bottom:2px}
.cc q{display:block;color:var(--muted);font-size:12px;quotes:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .nt{white-space:pre-wrap;color:var(--ink);margin:2px 0;overflow-wrap:anywhere}
.cc .rp{color:var(--warn);font-size:12.5px;background:var(--g-soft);border-radius:6px;padding:4px 8px;margin:4px 0;white-space:pre-wrap}
.cc .acts{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.cc .acts button{border:0;background:none;padding:3px 8px;border-radius:6px;font-size:12.5px;color:var(--muted)}
.cc .acts button:hover{background:var(--hover);color:var(--ink)}
.cc .acts .save{background:var(--h);color:var(--on-acc);font-weight:700}
.cc .acts .save:hover{background:var(--h);color:var(--on-acc);filter:brightness(1.08)}
.cc textarea{display:block;width:100%;min-height:64px;margin-top:4px;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font:inherit;font-size:13.5px;resize:vertical;background:var(--paper);color:var(--ink);outline:none}
.cc textarea:focus{border-color:var(--h)}
.docCmts{display:flex;flex-direction:column;gap:8px;margin:14px 0 0}
.docCmts:empty{display:none}
.docCmts .cc,.cmtSheet .cc{position:static;width:auto}
.cmtSheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:21;max-width:520px;margin:0 auto}
/* 11/16 동기화 기록 — 도구줄 오른쪽 끝 버튼 + 오른쪽 패널(폰은 꽉 찬 시트). 커밋 기록 + _동기화기록.jsonl + (폰) 폰 안 실패 */
.slBtn{margin-left:auto;flex:none;position:sticky;right:0;border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap}
.slBtn:hover{background:var(--hover);color:var(--ink)}
.slog{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:40;background:var(--raised);border-left:1px solid var(--line2);box-shadow:-12px 0 40px var(--shade2);display:flex;flex-direction:column}
.slog[hidden]{display:none}
.sl-top{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.sl-top b{flex:1;font-size:16px;font-weight:800}
.sl-st{padding:10px 16px;font-size:13px;line-height:1.6;color:var(--ink2);background:var(--well);border-bottom:1px solid var(--line)}
.sl-st .bad{color:var(--warn);font-weight:700}
.sl-list{list-style:none;margin:0;padding:4px 0 max(16px,env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch;flex:1}
.sl-list li{padding:8px 16px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--ink2);overflow-wrap:anywhere}
.sl-list li .w{color:var(--muted);font-variant-numeric:tabular-nums}
.sl-list li .a{font-weight:700}
.sl-list li.phone .a{color:var(--h)} .sl-list li.mac .a{color:var(--j)}
.sl-list li.conflict{background:var(--h-soft)} .sl-list li.conflict .a{color:var(--h)} .sl-list li.merge .a{color:var(--j)}
.sl-list li.fail{background:var(--g-soft)} .sl-list li.fail .a{color:var(--warn)}
.sl-list li .m{color:var(--muted);font-size:12.5px}
.sl-list button.n{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;text-align:left;cursor:pointer}
.sl-list button.n:hover{color:var(--acc)}
.sl-list .gone{color:var(--muted)}
.sl-empty{padding:30px 16px;color:var(--muted);font-size:13.5px;text-align:center}
@media (max-width:760px){.slog{width:100%;border-left:0}.slBtn{padding:5px 8px}}

.cmtSheet .cc{box-shadow:0 8px 30px var(--veil);padding:12px 14px;font-size:14px}
.cmtSheet .cc .acts button{font-size:13.5px;padding:6px 10px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><b>지식 작업실</b><span>쓰면 쌓인다</span></div>
    <button class="todayBtn" data-today="1"><span>오늘 일지 쓰기</span><small id="todayLbl"></small></button>
    <button class="shotBtn" id="shotBtn" title="노트에 쓴 손글씨를 카메라로 찍어 두면 클로드가 옮겨 적어요"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6.5h3l1.5-2h5l1.5 2h3v9H3z"/><circle cx="10" cy="10.5" r="3"/></svg>필사 찍기</button>
    <div class="search">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" placeholder="찾기" autocomplete="off">
    </div>
    <div class="cols" id="cols"></div>
    <div class="side-foot">폴더 <button data-reveal="gongsik">공략집</button><button data-reveal="jeongri">정리본</button><button data-reveal="gasul">업무일지</button><button data-reveal="mind">마인드맵</button></div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs"><button class="tb menu-btn" id="menuBtn" aria-label="목록 열기"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button><button class="tb slBtn" id="slBtn" type="button" title="어느 기기에서 언제 무엇이 올라가고 내려왔는지 · 충돌·실패">🔄 동기화 기록</button></div>
    <div class="bar" id="bar" hidden>
      <button class="tb" data-cmd="h2" title="큰 제목 (공략집·정리본 PDF에서 새 쪽) · 한글 Ctrl+3(개요1) · 줄 맨 앞에 # 띄어쓰기">큰 제목</button>
      <button class="tb" data-cmd="h3" title="소제목 · 한글 Ctrl+4(개요2)">소제목</button>
      <button class="tb" data-cmd="p" title="본문 · 한글 Ctrl+2 · 제목 맨 앞에서 지우기">본문</button>
      <span class="sep"></span>
      <button class="tb" data-cmd="bold" title="진하게 · 한글 Ctrl+B · Alt+Shift+B"><b>가</b></button>
      <button class="tb" data-cmd="mark" title="형광펜 (글자를 드래그한 뒤) · ⌘⇧H (한글엔 단축키 없음)"><span class="hl">형광펜</span></button>
      <button class="tb" data-cmd="red" title="빨강 강조 — 벽보처럼 빨간 글자 (글자를 드래그한 뒤) · ⌘⇧E · 다시 누르면 풀림"><span class="rd">빨강</span></button>
      <span class="sep"></span>
      <button class="tb" data-cmd="ul" title="글머리 목록 · 한글 Ctrl+Shift+Delete(맥 Ctrl+Shift+8) · Tab·Shift+Tab 수준">목록</button>
      <button class="tb" data-cmd="ol" title="번호 목록 · 한글 Ctrl+Shift+Insert(맥 Ctrl+Shift+7)">번호</button>
      <button class="tb" data-cmd="todo" title="체크 목록 · 줄 맨 앞에 [] 띄어쓰기">체크</button>
      <button class="tb" data-cmd="quote" title="핵심 상자 (PDF에서 빨간 「핵심」 검은 상자) · ⌘⇧K (한글엔 없음)"><span class="qk">핵심</span></button>
      <button class="tb" data-cmd="hr" title="구분선 · 빈 줄에 --- 치고 Enter">구분선</button>
      <span class="sep"></span>
      <button class="tb" id="cmtBtn" title="글 전체에 댓글(고칠 지시) — 부분 댓글은 글자를 드래그한 뒤 「💬 댓글」 또는 ⌘⇧M. 「저장하고 PDF」 때 다듬기에 반영돼요">💬</button>
      <button class="tb jxtool" id="mapBtn" hidden title="큰 제목 → 소제목 → 목록 줄을 마인드맵으로 보기(읽기) · 가지를 누르면 그 자리로 (Xmind 개요↔지도)">지도로 보기</button>
      <span class="grow"></span>
      <span class="jxseg jxtool" id="modeSeg" hidden role="group" aria-label="문서·화이트보드 전환"><button type="button" data-mode="doc" class="on" title="문서 (AFFiNE 문서 모드)">문서</button><button type="button" data-mode="board" title="화이트보드 — 구역이 카드로 (AFFiNE 무한 캔버스)">화이트보드</button></span>
      <button class="btn ghost" id="cmtNav" hidden title="누를 때마다 다음 댓글로">댓글</button>
      <span class="status count" id="count"></span><span class="status" id="status"></span>
      <button class="btn ghost" id="focusBtn" title="집중 모드 (⌘. · Esc로 나가기)">집중</button>
      <button class="btn ghost" id="trashBtn" title="휴지통(지식작업실/원본/.휴지통)으로 옮겨요">지우기</button>
      <button class="btn" id="viewPdf">PDF 보기</button>
      <button class="btn primary" id="saveBtn">저장하고 PDF</button>
    </div>
    <div class="scroll" id="scroll"></div>
  </main>
</div>
<dialog class="cam" id="cam" aria-label="필사 찍기">
  <div class="cam-top"><b>필사 찍기</b><span id="camInfo">노트를 화면에 맞추고 찍기(스페이스)를 누르세요. 여러 장 찍어도 돼요.</span><button class="btn ghost cam-x" id="camClose">닫기</button></div>
  <div class="cam-stage"><video id="camVideo" autoplay playsinline muted poster="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="></video><div class="cam-msg" id="camMsg" hidden></div></div>
  <div class="cam-strip" id="camStrip"></div>
  <div class="cam-bot"><span class="status" id="camCount">0장</span><span class="grow"></span><button class="shutter" id="camShoot">찍기</button><span class="grow"></span><button class="btn primary" id="camDone" disabled>완료</button></div>
</dialog>
<div class="toast" id="toast"></div>
<aside class="slog" id="slog" hidden aria-label="동기화 기록"><div class="sl-top"><b>🔄 동기화 기록</b><button class="btn ghost" id="slRe" type="button">새로고침</button><button class="btn primary" id="slX" type="button">닫기</button></div><div class="sl-st" id="slSt">불러오는 중…</div><ol class="sl-list" id="slList"></ol></aside>
<div class="ctx" id="ctx" hidden role="menu" aria-label="글 메뉴"><div class="who" id="ctxWho"></div><button type="button" role="menuitem" data-act="rename">이름 바꾸기</button><button type="button" role="menuitem" class="danger" data-act="del">지우기</button></div>
<aside class="slog" id="trashPanel" hidden aria-label="휴지통"><div class="sl-top"><b>휴지통</b><button class="btn primary" id="trX" type="button">닫기</button></div><div class="sl-st" id="trSt">지운 글은 여기 모여요. 「되살리기」를 누르면 원래 칸으로 돌아가요(같은 이름이 있으면 「이름 (되살림)」).</div><ol class="sl-list" id="trList"></ol></aside>
<button class="cmtPop" id="cmtPop" hidden title="고른 글자에 고칠 지시 달기 (⌘⇧M)">💬 댓글</button>
<div class="cmtSheet" id="cmtSheet" hidden></div>

<script>
const COLOR = {gongsik:['var(--g)','var(--g-soft)'], jeongri:['var(--j)','var(--j-soft)'], gasul:['var(--h)','var(--h-soft)'], mind:['var(--m)','var(--m-soft)']};
const NAME = {gongsik:'공략집', jeongri:'지식정리본', gasul:'업무일지', mind:'마인드맵'};
const KICK = {gongsik:'MY PLAYBOOK · 공략집', jeongri:'KNOWLEDGE NOTE · 지식정리본', gasul:'WORK LOG · 업무일지', mind:'MIND MAP · 마인드맵'};
const ORDER = ['gongsik','jeongri','gasul','mind'];   // 11/20 네 번째 칸 마인드맵
const SHORT = {gongsik:'공략집', jeongri:'정리본', gasul:'업무일지', mind:'마인드맵'};
const LEDGER = '가설 장부';
const MOTTO = '이 메뉴얼은 까먹는 나를 위한 지침서다. 새롭게 배우거나 체화된 내용은 최신화한다.';   // 나만의 공식집 고정 문구 (11/14 사장님) — server.py MOTTO와 같게
let data = null, tabs = [], cur = null, seq = 0;
const PHONE = typeof window.LocalApi === 'function';   // 11/15 폰앱으로 열렸나 (맥 서버판은 false — 그대로)
if (PHONE) document.documentElement.classList.add('phone');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t,ms=2200){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms)}
async function api(path, body){
  if (PHONE) return window.LocalApi(path, body);   // 11/15 폰앱: 서버 대신 폰 안 저장소(IndexedDB) — 폰앱/phone.js
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  return r.json();
}

/* 날짜 */
const WD = '일월화수목금토';
const p2 = n => String(n).padStart(2,'0');
function today(){ const d=new Date(); return {ym:`${d.getFullYear()}-${p2(d.getMonth()+1)}`, key:`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`, label:`${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`, d}; }
const isMonth = n => /^\d{4}-\d{2}$/.test(n||'');
function pretty(c, n){ if (c==='gasul' && isMonth(n)) return `${+n.slice(0,4)}년 ${+n.slice(5)}월 일지`; return n||'제목 없음'; }
const fixedName = t => t.c==='gasul';  // 가설일지 칸은 이름을 바꾸지 않는다(월 파일·장부)

/* 목록 */
async function loadList(){ data = await api('/api/list'); await loadTrash(); renderSide(); }
/* 11/21 휴지통 — 맥: /api/trashlist(원본/<칸>/.휴지통) · 폰: phone.js(맥 휴지통 거울 + 이 폰에서 지운 것) */
let trashData = null;
async function loadTrash(){ try{ const r = await api('/api/trashlist'); if (r && r.items){ trashData = r; showRevived(); if (!$('#trashPanel').hidden) trRender(); } }catch(e){} }
function monthDays(){ const m = data && data.gasul.docs.find(d=>d.name===today().ym); return m ? m.days : 0; }
function renderSide(hits){
  const box = $('#cols'); let h = '';
  $('#todayLbl').textContent = today().label;
  if (hits){
    h += `<div class="col"><div class="col-h">찾은 글 <span class="n">${hits.length}</span></div>`;
    h += hits.length ? hits.map(x=>rowOf(x.c, x.name, `<button class="item hit" style="--c:${COLOR[x.c][0]}" data-open="${x.c}|${esc(x.name)}">${esc(pretty(x.c,x.name))}<small>${NAME[x.c]}${x.snip?': '+esc(x.snip):''}</small></button>`)).join('') : '<div class="empty">없어요</div>';
    box.innerHTML = h + '</div>'; return;
  }
  for (const c of ORDER){
    const d = data[c];
    const cnt = c==='gasul' ? d.docs.filter(x=>!x.ledger).length : d.docs.length;
    h += `<div class="col" style="--c:${COLOR[c][0]}"><div class="col-h">${NAME[c]} <span class="n">${cnt}</span><button class="add" data-new="${c}" title="${c==='gasul'?'오늘 일지':c==='mind'?'새 마인드맵':'새 글'}">+</button></div>`;
    if (!d.docs.length) h += `<div class="empty">아직 글이 없어요. + 로 시작</div>`;
    for (const x of d.docs){
      const on = cur && cur.c===c && cur.saved===x.name ? ' on' : '';
      const sm = c==='gasul' ? (x.ledger ? '클로드가 채우는 표' : `${x.days}일 기록, ${x.updated.slice(5)}`) : `${x.updated}${x.pdf?'':', PDF 없음'}`;
      h += rowOf(c, x.name, `<button class="item${on}" data-open="${c}|${esc(x.name)}">${esc(pretty(c,x.name))}<small>${sm}</small></button>`);
    }
    if (d.pdfOnly.length){
      h += `<div class="sub">PDF만 있는 것 (보기만)</div>`;
      h += d.pdfOnly.map(n=>`<button class="item pdfonly" data-pdf="${c}|${esc(n)}">${esc(n)}</button>`).join('');
    }
    h += '</div>';
  }
  const tn = trashData ? trashData.items.length : 0;
  h += `<button class="trashLink" type="button" data-trash="1" title="지운 글 보기 · 되살리기"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9M6.6 7v4.5M9.4 7v4.5"/></svg>휴지통 <span class="n">(${tn})</span></button>`;
  box.innerHTML = h;
}
const TRASH_SVG = '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9M6.6 7v4.5M9.4 7v4.5"/></svg>';
function rowOf(c, n, inner){ return `<div class="row">${inner}<button class="rowDel" type="button" data-del="${c}|${esc(n)}" title="지우기 (휴지통으로)" aria-label="${esc(pretty(c,n))} 지우기">${TRASH_SVG}</button></div>`; }

async function openToday(){
  const td = today();
  const r = await api('/api/today', {c:'gasul', ym:td.ym});
  if (!r.ok) return toast(r.err||'일지를 못 열었어요');

}
function ensureToday(t){  // 11/14 아래로 이어 쓰기: 이번 달 일지를 열면 오늘 칸이 맨 아래에 (이미 있으면 그대로)
  const td = today(), ed = $('#ed');
  if (!ed || t.c!=='gasul' || t.saved!==td.ym) return false;
  if (ed.querySelector(`h2[data-day="${td.key}"]`)) return false;
  const h = document.createElement('h2'); h.dataset.day = td.key; h.textContent = td.label;
  const p = document.createElement('p'); p.appendChild(document.createElement('br'));
  ed.append(h, p); t.html = edHtml();  // 비어 있는 오늘 칸만으로는 '저장 안 됨' 표시 안 함
  return true;
}
function focusToday(){
  const ed = $('#ed'); if (!ed) return;
  const h = ed.querySelector(`h2[data-day="${today().key}"]`); if (!h) return;
  let last = h.nextElementSibling;   // 오늘 칸의 마지막 줄 끝으로
  while (last && last.nextElementSibling && last.nextElementSibling.tagName!=='H2') last = last.nextElementSibling;
  if (!last || last.tagName==='H2'){ last = document.createElement('p'); last.appendChild(document.createElement('br')); h.after(last); }
  ed.focus();
  const r = document.createRange(); r.selectNodeContents(last); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const sc = $('#scroll'); const down=()=>sc.scrollTo({top:sc.scrollHeight, behavior:'instant'}); down(); requestAnimationFrame(down);
}

/* 11/15 큰 제목 순서 바꾸기: 제목부터 다음 큰 제목 앞까지를 한 덩어리로 위·아래 */
function sectionOf(h){ const a=[h]; let n=h.nextElementSibling; while(n && n.tagName!=='H2'){ a.push(n); n=n.nextElementSibling; } return a; }
function moveSection(h, d){
  const ed=$('#ed'), hs=[...ed.querySelectorAll(':scope > h2')], i=hs.indexOf(h), o=hs[i+d]; if(!o) return;
  if(d<0){ for(const el of sectionOf(h)) o.before(el); }            // 내 덩어리를 윗 제목 앞으로
  else   { for(const el of sectionOf(o)) h.before(el); }            // 아랫 덩어리를 내 제목 앞으로
  markDirty(); placeMoves(); clearTimeout(placeMoves._t);
  if (h.animate){ const hl=getComputedStyle(document.documentElement).getPropertyValue('--soft').trim()||'#f6d860';   // 11/15 클래스 대신 애니메이션만(저장본에 class가 안 남게)
    h.animate([{background:hl},{background:'transparent'}],{duration:1200,easing:'ease-out'}); }
  h.scrollIntoView({block:'center', behavior:'smooth'});
}
function placeMoves(){
  const pa=$('.paper'), ed=$('#ed'); if(!pa||!ed) return;
  pa.querySelectorAll('.mv').forEach(x=>x.remove());
  if (ed.classList.contains('journal')) return;
  const hs=[...ed.querySelectorAll(':scope > h2')]; if(hs.length<2) return;
  const pr=pa.getBoundingClientRect();
  hs.forEach((h,i)=>{
    const r=h.getBoundingClientRect(), box=document.createElement('div'); box.className='mv';
    box.style.top=(r.top-pr.top + Math.max(0,(r.height-47)/2))+'px';
    const mk=(txt,d,tip)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=txt; b.title=tip; b.tabIndex=-1;
      b.disabled = !hs[i+d]; b.addEventListener('mousedown', e=>e.preventDefault()); b.addEventListener('click', ()=>moveSection(h,d)); return b; };
    box.append(mk('▲',-1,'이 큰 제목 구역을 위로'), mk('▼',1,'이 큰 제목 구역을 아래로')); pa.append(box);

const cam = {stream:null, shots:[], batch:''};
function camMsg(t, retry){ const m=$('#camMsg'); m.hidden=!t; m.innerHTML=t?`<div>${t}${retry?'<br><button class="btn cam-retry" id="camRetry">다시 켜기</button>':''}</div>`:''; if(retry) $('#camRetry').onclick=camOpen; }

async function camOpen(){

function cleanH2(){ const ed=$('#ed'); if(!ed) return; clearMarks(); ed.querySelectorAll('h2').forEach(h=>{ h.classList.remove('moved'); if(h.hasAttribute('class') && !h.getAttribute('class').trim()) h.removeAttribute('class'); }); }   // 11/15 예전 ▲▼ 흔적 걷기
async function save(auto=false){
  const t = cur; if(!t) return; if(t===cur) cleanH2(); syncCur();
  if (auto && (!t.dirty || (t.c!=='gasul' && t.c!=='mind'))) return;
  if (auto && t.c==='mind' && !t.saved && (t.blank || !mindName(t) || (!(t.name||'').trim() && t.center==='중심 주제'))) return;   // 11/20 손 안 댄 새 마인드맵은 파일로 안 만듦
  if (t.saving){ t.again = true; return; }
  const name = fixedName(t) ? t.saved : t.c==='mind' ? mindName(t) : (t.name||'').trim();
  if(!name){ if(auto) return; toast('제목을 먼저 쓰세요'); $('#title').focus(); return; }
  const pdfless = t.c==='gasul' || PHONE, sent = t.html;
  const btn=$('#saveBtn'); btn.disabled=true; t.saving=true;
  const tidy = !auto && !pdfless && t.c!=='mind';   // 11/20 마인드맵은 다듬기 없음 · 11/14: 손으로 누른 저장은 공식집 규칙대로 다듬은 뒤 저장 (폰은 다듬기 없음 — 맥 서버 일)
  setStatus(pdfless || auto ? '저장 중…' : tidy ? '규칙대로 다듬는 중… (1분쯤, 그동안 글은 잠가요)' : '저장하고 PDF 만드는 중…','busy');
  const lockEd = on => { if(cur===t && $('#ed')) $('#ed').contentEditable = on ? 'false' : 'true'; };
  if (tidy){ lockEd(true); $('#cmtPop').hidden=true; }
  const ask = PHONE && !auto && t.c!=='gasul';   // 11/15 폰 「저장하고 PDF」 = 맥북에 「다듬기 + PDF」 요청을 같이 보냄
  let r; try{ r=await api('/api/save',{c:t.c, old:t.saved, name, html:sent, tidy: tidy||ask, base:t.ver||(t.saved?'unknown':undefined), by:'tab', pdf: !auto}); }catch(e){ r={ok:false,err:PHONE?'폰에 저장하지 못했어요':'서버가 꺼져 있어요'}; }
  if (tidy) lockEd(false);
  btn.disabled=false; t.saving=false;
  if(!r.ok){ if(cur===t) setStatus('저장 못 함','err'); return toast(r.err||'저장 못 했어요'); }
  if (tidy && r.html && r.html !== sent){ t.html = r.html; if(cur===t && $('#ed')){ loadEd(t, r.html); placeMoves(); t.html = edHtml(); } }
  // 11/21 다른 기기에서 바뀐 글과 자동으로 합쳐 저장됨 → 합친 판을 탭에. 저장하는 사이 더 쓴 게 있으면 탭은 그대로 두고(판도 그대로) 다음 저장 때 또 합침 — 빠지는 글 없음
  let mergeKeep = false;
  if (r.merged && !tidy && r.html && r.html !== sent){
    if (cur===t) syncCur();
    if (t.html === sent){ t.html = r.html; if (cur===t && $('#ed')){ const y=$('#scroll').scrollTop; loadEd(t, r.html); t.html = edHtml(); $('#scroll').scrollTop=y; } else if (cur===t && t.c==='mind'){ cur=null; show(t); } }
    else mergeKeep = true;
  }
  const sentNow = (tidy || (r.merged && !mergeKeep)) && r.html ? t.html : sent;
  const now = (cur===t && $('#ed')) ? edHtml() : t.html;
  t.dirty = now !== sentNow; t.saved=r.name; t.updated=r.updated; if (!mergeKeep) t.ver=r.ver; t.savedHtml=r.html||sent; if (t.chg && (t.chg.kind!=='conflict' || (r.merged && !mergeKeep))){ t.chg=null; t.outside=false; putBanner(t); }   // 11/16 저장하면 「바뀜·휴지통」 띠는 걷음 · 11/21 합쳐 저장했으면 「바꿨어요」 띠도
  if (!fixedName(t) || r.conflict) t.name=r.name;
  if (r.conflict){ t.outside=false; t.chg=null; if(cur===t && ($('#ed')||t.c==='mind')){ t.html=edHtml(); cur=null; show(t); } }   // 11/15 다른 기기에서 먼저 바뀜 → 내 글은 새 이름으로

  }
  renderTabs(); persistTabs(); await loadList();
  if (r.conflict) toast(`${PHONE?'맥북':'다른 기기'}에서 먼저 바뀐 글인데 자동으로 못 합쳐서, 내 글은 「${r.name}」 새 글로 따로 저장했어요`, 9000);
  else if (r.merged) toast(`${PHONE?'맥북':'다른 기기'}에서 바뀐 글과 합쳐 저장했어요${r.merged.add?` · ${r.merged.add}줄 들어옴`:''} — 빠진 글 없음`, 5000);
  else if (!auto) toast(PHONE && t.c!=='gasul' ? `저장됨 · 맥북이 켜지면 ${t.c==='mind'?'':'다듬고 '}PDF로 만들어요` : pdfless ? '저장했어요'
    : r.skip ? `다듬기는 건너뛰고 그대로 저장했어요 (${r.skip})${cmtCount()?` · 댓글 ${cmtCount()}개는 그대로`:''}`
    : tidy && r.changes && r.changes.length ? `규칙대로 다듬어 저장 · PDF ${r.pages}쪽 — ${r.changes.slice(0,4).join(' / ')}${r.changes.length>4?` 외 ${r.changes.length-4}개`:''}`
    : `「${r.name}」 저장 · PDF 새로 만들었어요${tidy?' (고칠 것 없음)':''}`, tidy?9000:PHONE&&t.c!=='gasul'?4500:2200);
  if (t.dirty && (t.again || pdfless || t.c==='mind' || mergeKeep)){ t.again=false; clearTimeout(aT); aT=setTimeout(()=>save(true), 600); }
}

/* 11/21 지우기 한 곳 — 글 오른쪽 위 「지우기」·목록 휴지통 아이콘·오른쪽 클릭·길게 누르기 메뉴가 다 여기로. 확인창 문구는 예전 그대로 */
async function trashDoc(c, n){

const itemOf = el => { const b = el && el.closest && el.closest('.side .item[data-open]'); if (!b) return null; const [c,...n] = b.dataset.open.split('|'); return {b, c, n:n.join('|')}; };
const LP = {t:0, x:0, y:0, fired:0};
document.addEventListener('contextmenu', e=>{

  e.preventDefault(); if (Date.now() - LP.fired < 900) return;   // 안드로이드는 길게 누르면 contextmenu 도 옴 — 한 번만

}, true);
document.addEventListener('pointermove', e=>{ if (LP.t && Math.hypot(e.clientX-LP.x, e.clientY-LP.y) > 10){ clearTimeout(LP.t); LP.t = 0; } }, true);
['pointerup','pointercancel'].forEach(k=>document.addEventListener(k, ()=>{ clearTimeout(LP.t); LP.t = 0; }, true));
document.addEventListener('click', e=>{   // 길게 누른 뒤 손을 떼면 오는 click 은 글을 열지 않게
  if (Date.now() - LP.fired < 900 && itemOf(e.target)){ e.preventDefault(); e.stopPropagation(); }
}, true);

  const names = new Map(); if (data) for (const c of ORDER) for (const x of (data[c]||{docs:[]}).docs) names.set(c+'|'+String(x.name).normalize('NFC'), x.name);   // 디스크 이름(NFD일 수 있음) ↔ 기록 이름(NFC)
  ul.innerHTML = rows.length ? rows.map(r=>{
    const nm = r.n ? (r.kind==='conflict' ? `「${esc(pretty(r.c,r.n))}」` : esc(pretty(r.c,r.n))) : '';
    const open = r.n && r.c && !r.gone && names.has(r.c+'|'+r.n);
    const title = !r.n ? '' : ' · ' + (open ? `<button class="n" type="button" data-c="${esc(r.c)}" data-n="${esc(names.get(r.c+'|'+r.n))}">${nm}</button>` : `<span class="gone">${nm}</span>`);
    const extra = (r.msg && r.kind!=='fail' && r.kind!=='skip' ? ` <span class="m">(${esc(r.msg)})</span>` : '')
      + (r.kind==='fail'||r.kind==='skip' ? ' · ' + esc(r.msg||'') + (r.cnt>1 ? ` <span class="m">(×${r.cnt}, ${esc(slWhen(r.t0||r.t))}부터)</span>` : '') : '');
    return `<li class="${r.kind} ${r.dev==='폰'?'phone':'mac'}"><span class="w">${slWhen(r.t)}</span> · <span class="a">${esc(r.label)}</span>${title}${extra}</li>`;
  }).join('') : '<li class="sl-empty">아직 기록이 없어요</li>';
}
function slOpen(){ $('#slog').hidden = false; $('#app').classList.remove('menu'); slLoad(); }

$('#slX').onclick = slClose; $('#slRe').onclick = slLoad;
$('#slList').addEventListener('click', async e=>{

/* 11/16 댓글 — 사장님이 글의 한 부분(또는 글 전체)에 고칠 지시를 단다. 「저장하고 PDF」 다듬기 때 지시로 반영(server.py polish·settle_cmts).
   부분 댓글: <span class="cmt" data-cmt="id" data-note="지시" [data-reply="클로드: 못 한 이유"]>글자</span> (여러 줄이면 같은 id 여러 개)
   글 전체 댓글: 맨 앞 <div class="cmt-doc" data-cmt data-note hidden></div> — 편집기 #ed 밖(t.docCmts)에 두고 저장할 때만 앞에 붙인다(edHtml). */
const CMT_SEL='span.cmt[data-cmt]';
let cmtNew=null, cmtEdit=null, cmtActive=null, cmtSel=null, cmtNavI=-1;
const cmtId=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function splitDoc(h){ h=String(h||''); const m=h.match(/^(?:\s*<div\b[^>]*\bclass="cmt-doc"[^>]*>\s*<\/div>)*/); const pre=m?m[0]:'';
  const tp=document.createElement('template'); tp.innerHTML=pre;
  return [[...tp.content.querySelectorAll('div.cmt-doc')].map(d=>({id:d.dataset.cmt||cmtId(), note:d.dataset.note||'', reply:d.dataset.reply||''})).filter(c=>c.note.trim()), h.slice(pre.length)]; }
function docPrefix(t){ return ((t&&t.docCmts)||[]).filter(c=>c.note.trim()).map(c=>`<div class="cmt-doc" data-cmt="${esc(c.id)}" data-note="${esc(c.note)}"${c.reply?` data-reply="${esc(c.reply)}"`:''} hidden></div>`).join(''); }
function edHtml(){ if (cur && cur.c==='mind' && window.Mind && Mind.on()) return Mind.html(); const ed=$('#ed'); return docPrefix(cur) + (ed ? noMarks(JXB.html(ed)) : '') + JXBoard.tail(cur); }   // 11/21 블록 없는 글은 innerHTML 그대로 · 화이트보드는 맨 끝 꼬리
function noMarks(h){ return h.replace(/ class="([^"]*\bjx-new\b[^"]*)"/g, (m,c)=>{ const k=c.split(/\s+/).filter(x=>x&&x!=='jx-new').join(' '); return k?` class="${k}"`:''; }); }   // 11/16 「바뀐 곳」 표시는 저장·초안·비교에 절대 안 들어가게
function loadEd(t, h){ const [d, b0]=splitDoc(h); const [bj, b]=JXBoard.cut(b0); t.docCmts=d; t.board=bj; cmtNew=cmtEdit=null; cmtSheetClose(); $('#ed').innerHTML=b; renderCmts(); JXB.attach(); if (JXBoard.on()) JXBoard.refresh(); }
function cmtGroups(){ const m=new Map(), ed=$('#ed'); if(!ed) return m;
  ed.querySelectorAll(CMT_SEL).forEach(sp=>{ const id=sp.dataset.cmt; if(!m.has(id)) m.set(id,{id, els:[], note:sp.dataset.note||'', reply:sp.dataset.reply||''}); m.get(id).els.push(sp); });
  return m; }
function cmtCount(){ return cur ? (cur.docCmts||[]).length + [...cmtGroups().values()].filter(g=>g.note.trim()).length : 0; }
function cmtData(id){ const d=(cur&&cur.docCmts||[]).find(c=>c.id===id); if(d) return {...d, doc:true, text:''};
  const g=cmtGroups().get(id); return g ? {...g, doc:false, text:g.els.map(e=>e.textContent).join(' ').replace(/\s+/g,' ').trim()} : null; }
function cmtWide(){ const sc=$('#scroll'); return !!sc && sc.clientWidth >= 1064; }
function cmtCard(c){
  const el=document.createElement('div'); el.className='cc'+(cmtActive===c.id?' on':''); el.dataset.id=c.id; el.dataset.doc=c.doc?'1':'';
  const editing = (cmtNew&&cmtNew.id===c.id) || cmtEdit===c.id;
  el.innerHTML = (c.doc?'<span class="tag">💬 글 전체</span>':'') + (c.text?`<q>「${esc(c.text.slice(0,60))}${c.text.length>60?'…':''}」</q>`:'') + (editing
    ? `<textarea aria-label="댓글 지시" placeholder="${c.doc?'글 전체에 줄 지시 (예: 소제목을 모두 질문으로)':'고칠 지시 (예: 이 두 문장 합쳐 · 여기 소제목으로)'}">${esc(c.note)}</textarea><div class="acts"><button type="button" class="save" data-a="ok">저장</button><button type="button" data-a="cancel">취소</button><span class="grow"></span><span class="status">⌘↵ 저장</span></div>`
    : `<div class="nt">${esc(c.note)}</div>${c.reply?`<div class="rp">${esc(c.reply)}</div>`:''}<div class="acts"><button type="button" data-a="edit">고치기</button><button type="button" data-a="del">지우기</button><button type="button" data-a="done">해결</button></div>`);
  return el;
}
function renderCmts(){
  const pa=$('.paper'), ed=$('#ed'), box=$('#docCmts'); if(!pa||!ed||!box||!cur) return;
  const keep={}; document.querySelectorAll('.paper .cc textarea').forEach(x=>{ keep[x.closest('.cc').dataset.id]=[x.value, document.activeElement===x, x.selectionStart]; });
  const G=cmtGroups(), W=cmtWide() && G.size>0;
  $('#scroll').classList.toggle('rail', W);
  pa.querySelectorAll(':scope > .cc').forEach(x=>x.remove()); box.innerHTML='';
  for (const c of cur.docCmts||[]) box.append(cmtCard({...c, doc:true, text:''}));
  if (cmtNew && cmtNew.doc) box.append(cmtCard({id:cmtNew.id, doc:true, note:'', reply:'', text:''}));
  if (W){ const pr=pa.getBoundingClientRect(); let y=0;
    for (const g of G.values()){ const c=cmtData(g.id), el=cmtCard(c); pa.append(el);
      const top=Math.max(g.els[0].getBoundingClientRect().top-pr.top-8, y); el.style.top=top+'px'; y=top+el.offsetHeight+8; } }
  for (const [id,[v,f,p]] of Object.entries(keep)){ const x=document.querySelector(`.paper .cc[data-id="${CSS.escape(id)}"] textarea`); if(x){ x.value=v; if(f){ x.focus({preventScroll:true}); try{x.setSelectionRange(p,p)}catch(e){} } } }
  const n=cmtCount(), nb=$('#cmtNav'); nb.hidden=!n; nb.textContent=`💬 댓글 ${n}`;
  cmtPaint();
}
function cmtPaint(){ let st=$('#cmtOnCss'); if(!st){ st=document.createElement('style'); st.id='cmtOnCss'; document.head.append(st); }
  st.textContent = cmtActive ? `#ed span.cmt[data-cmt="${CSS.escape(cmtActive)}"]{background:var(--cmt-on)}` : '';
  document.querySelectorAll('.cc').forEach(x=>x.classList.toggle('on', x.dataset.id===cmtActive)); }
function cmtSheetOpen(id){ const c=cmtData(id) || (cmtNew&&cmtNew.id===id ? {id, doc:!!cmtNew.doc, note:'', reply:'', text:cmtNew.text||''} : null); if(!c) return cmtSheetClose();
  const sh=$('#cmtSheet'); sh.innerHTML=''; const el=cmtCard(c); el.querySelector('.acts').insertAdjacentHTML('beforeend','<span class="grow"></span><button type="button" data-a="close">닫기</button>'); sh.append(el); sh.hidden=false; sh.dataset.id=id;
  const ta=el.querySelector('textarea'); if(ta) ta.focus(); }
function cmtSheetClose(){ const sh=$('#cmtSheet'); if(!sh) return; sh.hidden=true; sh.innerHTML=''; sh.dataset.id=''; }
function cmtShow(id){ // 카드 열기: 넓은 화면은 옆 카드, 좁은 화면은 아래 카드
  cmtActive=id; const c=cmtData(id) || (cmtNew&&cmtNew.id===id?{doc:cmtNew.doc}:null); if(!c) return;
  if (c.doc || cmtWide()){ cmtSheetClose(); renderCmts(); const card=document.querySelector(`.paper .cc[data-id="${CSS.escape(id)}"]`); if(card){ const ta=card.querySelector('textarea'); if(ta) ta.focus({preventScroll:true}); } }
  else { cmtPaint(); cmtSheetOpen(id); }
}
function wrapRange(r, id){
  const ed=$('#ed'); let root=r.commonAncestorContainer; if(root.nodeType===3) root=root.parentNode;
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list=[]; let n, inOld=null;
  while ((n=tw.nextNode())){
    if (!r.intersectsNode(n)) continue;
    const s=n===r.startContainer?r.startOffset:0, e=n===r.endContainer?r.endOffset:n.length;
    if (s>=e || !n.data.slice(s,e).trim()) continue;
    const p=n.parentElement; if(!p || !ed.contains(p) || !p.closest(BLK+',td,th')) continue;
    const old=p.closest('.cmt'); if(old){ inOld=inOld||old.dataset.cmt; continue; }
    list.push([n,s,e]);
  }
  for (const [n,s,e] of list){ let t=n; if(e<t.length) t.splitText(e); if(s>0) t=t.splitText(s);
    const sp=document.createElement('span'); sp.className='cmt'; sp.dataset.cmt=id; sp.dataset.note=''; t.replaceWith(sp); sp.append(t); }
  return [list.length, inOld];
}
function unwrapCmt(id){ $('#ed').querySelectorAll(`span.cmt[data-cmt="${CSS.escape(id)}"]`).forEach(sp=>sp.replaceWith(...sp.childNodes)); $('#ed').normalize(); }
function cmtStart(r){
  if (!cur || !$('#ed')) return;
  if (cur.saving || $('#ed').contentEditable==='false') return toast('다듬는 중이에요. 끝나면 달아 주세요');
  if (!r || r.collapsed || !$('#ed').contains(r.commonAncestorContainer) || !r.toString().trim()) return toast('댓글 달 글자를 먼저 드래그하세요 (글 전체는 도구줄 💬)');
  cmtFlush();
  const id=cmtId(), [k, old]=wrapRange(r, id);
  $('#cmtPop').hidden=true;
  if (!k){ if(old){ toast('이미 댓글이 달린 글자예요'); return cmtShow(old); } return toast('댓글 달 글자를 먼저 드래그하세요'); }
  getSelection().removeAllRanges();
  cmtNew={id, doc:false}; cmtActive=id; renderCmts(); cmtShow(id);
}
function cmtStartDoc(){ if(!cur||!$('#ed')) return; if(cur.saving) return toast('다듬는 중이에요'); cmtFlush(); cmtNew={id:cmtId(), doc:true}; cmtActive=cmtNew.id; cmtSheetClose(); renderCmts();
  $('#scroll').scrollTo({top:0, behavior:'smooth'}); const ta=$('#docCmts textarea'); if(ta) ta.focus({preventScroll:true}); }
function cmtCommit(id, note){
  note=(note||'').trim(); const isNew=cmtNew&&cmtNew.id===id, doc=isNew?cmtNew.doc:!!(cur.docCmts||[]).find(c=>c.id===id);
  if (!note) return cmtCancel(id);
  if (doc){ const d=(cur.docCmts||[]).find(c=>c.id===id); if(d){ if(d.note!==note){ d.note=note; d.reply=''; } } else (cur.docCmts=cur.docCmts||[]).push({id, note, reply:''}); }
  else $('#ed').querySelectorAll(`span.cmt[data-cmt="${CSS.escape(id)}"]`).forEach(sp=>{ if(sp.dataset.note!==note){ sp.dataset.note=note; sp.removeAttribute('data-reply'); } });   // 지시를 고치면 지난 클로드 답은 뗀다
  cmtNew=null; cmtEdit=null; markDirty(); cmtSheetClose(); renderCmts();
}
function cmtCancel(id){ if (cmtNew&&cmtNew.id===id){ if(!cmtNew.doc) unwrapCmt(id); cmtNew=null; } cmtEdit=null; cmtSheetClose(); renderCmts(); }
function cmtRemove(id, msg){ if (cur.docCmts && cur.docCmts.some(c=>c.id===id)) cur.docCmts=cur.docCmts.filter(c=>c.id!==id); else unwrapCmt(id);
  if (cmtActive===id) cmtActive=null; cmtEdit=null; markDirty(); cmtSheetClose(); renderCmts(); toast(msg); }
function cmtFlush(){ // 저장·탭 바꿀 때 쓰던 댓글 마무리: 글이 있으면 저장, 없으면 취소
  const id = cmtNew ? cmtNew.id : cmtEdit; if(!id || !$('#ed')) return;
  const ta=document.querySelector(`.cc[data-id="${CSS.escape(id)}"] textarea`);
  ta && ta.value.trim() ? cmtCommit(id, ta.value) : cmtCancel(id); }
document.addEventListener('click', e=>{
  const b=e.target.closest('.cc [data-a]'); if(b){
    const card=b.closest('.cc'), id=card.dataset.id, a=b.dataset.a;
    if (cur && cur.saving && a!=='close') return toast('다듬는 중이에요');
    if (a==='ok') cmtCommit(id, card.querySelector('textarea').value);
    else if (a==='cancel') cmtCancel(id);
    else if (a==='edit'){ cmtEdit=id; cmtActive=id; card.closest('#cmtSheet') ? cmtSheetOpen(id) : (renderCmts(), (document.querySelector(`.paper .cc[data-id="${CSS.escape(id)}"] textarea`)||{focus(){}}).focus()); }
    else if (a==='del') cmtRemove(id, '댓글을 지웠어요');
    else if (a==='done') cmtRemove(id, '해결 — 댓글을 걷었어요');
    else if (a==='close'){ cmtFlush(); cmtSheetClose(); }
    return;
  }
  const card=e.target.closest('.paper .cc'); if(card && !e.target.closest('textarea')){ cmtActive=card.dataset.id; cmtPaint(); const g=cmtGroups().get(card.dataset.id); if(g) g.els[0].scrollIntoView({block:'nearest', behavior:'smooth'}); return; }
  const sp=e.target.closest('#ed span.cmt[data-cmt]');
  if (sp){ if(getSelection().isCollapsed) cmtShow(sp.dataset.cmt); return; }
  if (!e.target.closest('#cmtSheet,#cmtPop,#cmtNav') && !$('#cmtSheet').hidden && !(cmtNew||cmtEdit)) cmtSheetClose();
});
document.addEventListener('keydown', e=>{ const ta=e.target.closest && e.target.closest('.cc textarea'); if(!ta) return; const id=ta.closest('.cc').dataset.id;
  if (e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); cmtCommit(id, ta.value); }
  else if (e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); cmtCancel(id); } }, true);
/* 글자를 고르면 「💬 댓글」 버튼 (폰은 길게 눌러 고른 뒤 — 폰 기본 메뉴와 안 겹치게 아래로) */
function cmtPopUpdate(){
  const b=$('#cmtPop'), ed=$('#ed'), s=getSelection();
  if (!ed || !cur || cur.saving || !s.rangeCount || s.isCollapsed || ed.contentEditable==='false'){ b.hidden=true; return; }
  const r=s.getRangeAt(0); if (!ed.contains(r.commonAncestorContainer) || !r.toString().trim() || JXB.inMind(r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement)){ b.hidden=true; return; }
  cmtSel=r.cloneRange();
  const rs=r.getClientRects(), last=rs[rs.length-1]||r.getBoundingClientRect(), first=rs[0]||last, coarse=matchMedia('(pointer:coarse)').matches;
  b.hidden=false; const bw=b.offsetWidth||80;
  let x=Math.min(innerWidth-bw-8, Math.max(8, last.right-bw/2)), y=last.bottom+(coarse?40:8);
  if (y+44>innerHeight) y=Math.max(8, first.top-(coarse?84:44));
  b.style.left=x+'px'; b.style.top=y+'px';
}
document.addEventListener('selectionchange', ()=>{ clearTimeout(cmtPopUpdate._t); cmtPopUpdate._t=setTimeout(cmtPopUpdate,120); });
$('#scroll').addEventListener('scroll', ()=>{ if(!$('#cmtPop').hidden){ clearTimeout(cmtPopUpdate._s); cmtPopUpdate._s=setTimeout(cmtPopUpdate,80); } }, {passive:true});
$('#cmtPop').addEventListener('mousedown', e=>e.preventDefault());
$('#cmtPop').addEventListener('click', ()=>{ const s=getSelection(); cmtStart(s.rangeCount&&!s.isCollapsed ? s.getRangeAt(0).cloneRange() : cmtSel); });
$('#cmtBtn').onclick=cmtStartDoc;
$('#cmtNav').onclick=()=>{   // 차례로 이동
  if(!cur) return; const ids=[...(cur.docCmts||[]).map(c=>c.id), ...cmtGroups().keys()]; if(!ids.length) return;
  cmtNavI=(ids.indexOf(cmtActive)+1)%ids.length; const id=ids[cmtNavI], g=cmtGroups().get(id);
  if (g) g.els[0].scrollIntoView({block:'center', behavior:'smooth'}); else { const c=document.querySelector(`#docCmts .cc[data-id="${CSS.escape(id)}"]`); c && c.scrollIntoView({block:'center', behavior:'smooth'}); }
  cmtShow(id); $('#cmtNav').textContent=`💬 댓글 ${cmtNavI+1}/${ids.length}`;
};

/* 시작 */
document.execCommand('defaultParagraphSeparator', false, 'p');
(async()=>{
  await loadList();
  pullNow();   // 11/17 열 때(새로고침 포함) 폰에서 쓴 것 바로 받아 오기 — 기다리지 않음
  if (store.get('focus', false)) setFocus(true);
  for (const [c,n] of store.get('tabs',[])){
    if (data[c] && data[c].docs.some(d=>d.name===n)){
      const d=await api(`/api/doc?c=${c}&n=${encodeURIComponent(n)}`);
      const t={id:++seq,c,name:n,saved:n,html:d.html,savedHtml:d.html,updated:d.updated,ver:d.ver,dirty:false};

  const lc=store.get('cur',null);
